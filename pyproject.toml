[project]
name = "incident-triage"
version = "0.1.0"
description = "Search and AI assistant for incident triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlmodel>=0.0.24,<0.1",
    "streamlit>=1.40,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
